name: Deploy S3 Bucket CloudFormation Stack

on:
  push:
    branches: [main]
    paths:
      - 's3_bucket_file.yaml'
  workflow_dispatch:
    inputs:
      bucket_name:
        description: 'S3 bucket name'
        required: true
        type: string

env:
  AWS_REGION: ap-south-1
  STACK_NAME: Test-s3-bucket-Stack

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Debug OIDC token Claims
        run: |
          IDTOKEN=$(curl -sLS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
          echo "$IDTOKEN" | cut -d '.' -f2 | base64 -d 2> /dev/null | jq .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: arn:aws:iam::597663815469:role/github-actions-role-aws
          role-session-name: github-actions-${{ github.run_id }}
