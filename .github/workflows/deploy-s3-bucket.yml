name: Deploy S3 Bucket CloudFormation Stack

on:
  push:
    branches: [main]
    paths:
      - 's3_bucket_file.yaml'
  workflow_dispatch:
    inputs:
      bucket_name:
        description: 'S3 bucket name'
        required: true
        type: string

env:
  AWS_REGION: ap-south-1
  STACK_NAME: Test-s3-bucket-Stack

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: arn:aws:iam:ap-south-1:597663815469:role/github-actions-role-new
